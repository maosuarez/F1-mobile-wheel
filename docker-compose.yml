# Despliegue: HOST_PORT=28473 docker compose up -d --build
# Un solo puerto sirve juego (/), volante (/wheel/), /api y /ws.
#
# HTTPS (necesario para WebXR y wss en el celular) con cloudflared:
#   cloudflared tunnel --url http://localhost:28473
#   o en config.yml del tunel: ingress -> service: http://localhost:28473
# PUBLIC_URL por defecto: https://f1.maosuarez.com (los QR usan esa URL; se puede sobrescribir).
services:
  game:
    build: .
    ports:
      - "${HOST_PORT:-28473}:8000"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-https://f1.maosuarez.com}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
